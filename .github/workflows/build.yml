name: Build & Release StageLab Native

on:
  push:
    branches: [ main ]
    tags: [ '[0-9]*-*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish GitHub Release after successful build and signature verification'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK (Compile SDK 37 / Build Tools 37.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Decode release keystore
        env:
          STAGELAB_KEYSTORE_BASE64: ${{ secrets.STAGELAB_KEYSTORE_BASE64 }}
          STAGELAB_KEYSTORE_PASSWORD: ${{ secrets.STAGELAB_KEYSTORE_PASSWORD }}
          STAGELAB_KEY_ALIAS: ${{ secrets.STAGELAB_KEY_ALIAS }}
          STAGELAB_KEY_PASSWORD: ${{ secrets.STAGELAB_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_INPUT: ${{ inputs.publish == true }}
        run: |
          IS_RELEASE="false"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]] || [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLISH_INPUT" == "true" ]]; then
            IS_RELEASE="true"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]*=' stage-native/module/build.gradle.kts | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')"
            VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]*=' stage-native/module/build.gradle.kts | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')"
            AUTO_TAG="${VERSION_CODE}-${VERSION_NAME}"
            if [[ -f "docs/releases/${VERSION_NAME}.md" ]] && ! gh release view "$AUTO_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              IS_RELEASE="true"
            fi
          fi
          echo "IS_RELEASE=$IS_RELEASE" >> "$GITHUB_ENV"

          if [ -n "$STAGELAB_KEYSTORE_BASE64" ]; then
            printf '%s' "$STAGELAB_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > stage-native/release.jks
            chmod 600 stage-native/release.jks
            echo "STAGELAB_KEYSTORE_FILE=$GITHUB_WORKSPACE/stage-native/release.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
          elif [[ "$IS_RELEASE" == "true" ]]; then
            echo "::error::Missing STAGELAB_KEYSTORE_BASE64 for release publish. Refusing to publish a debug-signed Release APK."
            exit 1
          else
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

          if [[ "$IS_RELEASE" == "true" ]] && { [ -z "$STAGELAB_KEYSTORE_PASSWORD" ] || [ -z "$STAGELAB_KEY_ALIAS" ] || [ -z "$STAGELAB_KEY_PASSWORD" ]; }; then
            echo "::error::Missing STAGELAB_KEYSTORE_PASSWORD, STAGELAB_KEY_ALIAS, or STAGELAB_KEY_PASSWORD for release publish."
            exit 1
          fi

      - name: Run Core unit tests and assemble Debug/Release APKs
        working-directory: stage-native
        env:
          STAGELAB_KEYSTORE_PASSWORD: ${{ secrets.STAGELAB_KEYSTORE_PASSWORD }}
          STAGELAB_KEY_ALIAS: ${{ secrets.STAGELAB_KEY_ALIAS }}
          STAGELAB_KEY_PASSWORD: ${{ secrets.STAGELAB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :core:test :module:assembleDebug :module:assembleRelease --no-daemon

      - name: Verify release APK certificate SHA-256
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          EXPECTED_CERT_SHA256: 45a7a172c03d567cd910b304c2c83d43257c5fd988385712ad30589dd5661b70
        run: |
          set -euo pipefail
          APK="stage-native/module/build/outputs/apk/release/module-release.apk"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/{print tolower($NF); exit}')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          echo "Verified release certificate SHA-256: $ACTUAL_CERT_SHA256"

      - name: Determine release metadata and prepare APKs
        run: |
          set -euo pipefail
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]*=' stage-native/module/build.gradle.kts | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')"
          VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]*=' stage-native/module/build.gradle.kts | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')"
          EXPECTED_TAG="${VERSION_CODE}-${VERSION_NAME}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "$EXPECTED_TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Gradle version $EXPECTED_TAG"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME:-$EXPECTED_TAG}"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            TAG="$EXPECTED_TAG"
          fi
          ASSET="StageLab-Native-${VERSION_NAME}.apk"
          DEBUG_ASSET="StageLab-Native-${VERSION_NAME}-debug.apk"
          mkdir -p dist
          cp stage-native/module/build/outputs/apk/release/module-release.apk "dist/$ASSET"
          cp stage-native/module/build/outputs/apk/debug/module-debug.apk "dist/$DEBUG_ASSET"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload workflow APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StageLab-Native-APKs
          path: dist/*.apk

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE="docs/releases/${VERSION_NAME}.md"
          NOTES_ARGS=()
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving published assets unchanged."
          else
            gh release create "$RELEASE_TAG" \
              "dist/$RELEASE_ASSET" \
              --target "$GITHUB_SHA" \
              --title "StageLab Native $VERSION_NAME" \
              "${NOTES_ARGS[@]}"
          fi
